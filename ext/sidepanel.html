<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Email Assistant</title>
    <link rel="stylesheet" href="sidepanel.css">
</head>

<body>

    <!-- ============ LIST VIEW ============ -->
    <main id="listView">

        <header class="topbar">
            <h1>Email Assistant</h1>
            <button id="refreshBtn" class="btn ghost small" type="button">Refresh</button>
        </header>

        <div class="tabs" role="tablist" aria-label="Email source">
            <button id="tabInbox" class="tab" role="tab" aria-selected="true" type="button">Recent inbox</button>
            <button id="tabHistory" class="tab" role="tab" aria-selected="false" type="button">Processed</button>
        </div>

        <section class="tools" aria-label="Search and filters">

            <input id="search" type="search" placeholder="Search subject, sender or preview" aria-label="Search emails">

            <div class="chips" id="priorityChips" role="group" aria-label="Filter by priority">
                <button class="chip" type="button" data-priority="all" aria-pressed="true">All</button>
                <button class="chip" type="button" data-priority="critical" aria-pressed="false">Critical</button>
                <button class="chip" type="button" data-priority="high" aria-pressed="false">High</button>
                <button class="chip" type="button" data-priority="medium" aria-pressed="false">Medium</button>
                <button class="chip" type="button" data-priority="low" aria-pressed="false">Low</button>
            </div>

            <div class="grid">
                <label class="field">
                    <span>Category</span>
                    <select id="category"><option value="all">All categories</option></select>
                </label>
                <label class="field">
                    <span>Sort by</span>
                    <select id="sort">
                        <option value="newest">Newest first</option>
                        <option value="priority">Priority</option>
                    </select>
                </label>
                <label class="field" id="limitField">
                    <span>Fetch last</span>
                    <select id="limit">
                        <option value="10">10 emails</option>
                        <option value="14" selected>14 emails</option>
                        <option value="25">25 emails</option>
                        <option value="50">50 emails</option>
                    </select>
                </label>
            </div>

            <div class="toggles">
                <label class="check"><input id="meetingOnly" type="checkbox"> Has a meeting</label>
                <label class="check" id="unprocessedField"><input id="unprocessedOnly" type="checkbox"> Not processed yet</label>
            </div>
        </section>

        <div class="listbar">
            <span id="count" class="muted"></span>
            <button id="processNew" class="btn primary small" type="button" hidden>Process new</button>
        </div>

        <p id="status" class="status" role="status"></p>

        <ul id="emailList" class="emails"></ul>
    </main>


    <!-- ============ DETAIL VIEW ============ -->
    <main id="detailView" hidden>

        <header class="topbar">
            <button id="backBtn" class="btn ghost small" type="button">Back to list</button>
        </header>

        <div id="detailBody"></div>
    </main>

    <script src="sidepanel.js"></script>
</body>
</html>
